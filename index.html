<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashta W 3asal - Premium Delivery</title>
    
    <!-- الخطوط المستخدمة -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@300;400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* =========================================
           المتغيرات والألوان (الوضع العادي والليلي)
           ========================================= */
        :root {
            --primary: #E5A937;
            --primary-dark: #C68B22;
            --bg-color: #FFFDF7;
            --surface: #FFFFFF;
            --text-main: #2C1E16;
            --text-muted: #8A7A6B;
            --border: #EFE9D9;
            --success: #2E7D32;
            --danger: #D32F2F;
            --shadow-sm: 0 4px 15px rgba(0,0,0,0.05);
            --shadow-md: 0 10px 30px rgba(0,0,0,0.08);
            --font-en: 'Montserrat', sans-serif;
            --font-ar: 'Cairo', sans-serif;
            --font-head: 'Playfair Display', serif;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --surface: #1E1E1E;
            --text-main: #F5F5F5;
            --text-muted: #B0B0B0;
            --border: #333333;
            --shadow-sm: 0 4px 15px rgba(0,0,0,0.3);
            --shadow-md: 0 10px 30px rgba(0,0,0,0.5);
        }

        [dir="rtl"] { font-family: var(--font-ar); }
        [dir="ltr"] { font-family: var(--font-en); }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; 
        }
        
        html { scroll-behavior: smooth; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            overflow-x: hidden; 
            padding-bottom: 120px; 
        }

        /* شريط التمرير */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        /* =========================================
           شريط التنقل العلوي (Navbar)
           ========================================= */
        nav {
            position: fixed; 
            top: 0; 
            width: 100%; 
            background: rgba(255, 255, 255, 0.95);
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 5%;
            z-index: 1000; 
            box-shadow: var(--shadow-sm); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        [data-theme="dark"] nav { background: rgba(30, 30, 30, 0.95); }

        .nav-logo { 
            font-family: var(--font-head); 
            font-size: 22px; 
            font-weight: 700; 
            color: var(--text-main); 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            text-decoration: none;
            line-height: 1.1;
        }

        .nav-logo img { 
            width: 40px; 
            height: 40px; 
            object-fit: contain; 
            border-radius: 50%; 
            border: 1px solid var(--border); 
            background: #fff;
        }

        .nav-actions { display: flex; gap: 12px; align-items: center; }
        
        .icon-btn { 
            background: var(--bg-color); 
            border: 1px solid var(--border); 
            font-size: 16px; 
            color: var(--text-main); 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
        }
        
        .icon-btn:hover { color: var(--primary); border-color: var(--primary); }
        .lang-toggle { font-weight: 700; font-size: 13px; }

        /* =========================================
           الواجهة الرئيسية الجديدة والأنيقة (Sleek Hero)
           ========================================= */
        .hero {
            position: relative;
            margin-top: 60px; 
            padding: 50px 5% 40px;
            background-image: linear-gradient(rgba(18, 18, 18, 0.8), rgba(18, 18, 18, 0.9)), url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=1920&q=80');
            background-attachment: fixed; 
            background-size: cover; 
            background-position: center;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            color: #fff; 
            text-align: center;
        }

        /* الشعار المستدير الأنيق */
        .hero-logo-circle {
            width: 90px;
            height: 90px;
            background: #fff;
            border-radius: 50%;
            padding: 4px;
            margin-bottom: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }

        /* شارة الحالة النابضة */
        .status-badge {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            backdrop-filter: blur(5px);
            letter-spacing: 1px;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #4CAF50;
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(76, 175, 80, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.4); }
            70% { box-shadow: 0 0 0 8px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }

        .hero-title { 
            font-family: var(--font-head); 
            font-size: 3rem; 
            color: #fff; 
            margin-bottom: 8px; 
            letter-spacing: 1px;
        }
        .hero-title span { color: var(--primary); }

        .hero-subtitle { 
            font-size: 1rem; 
            font-weight: 400; 
            color: #ddd;
            margin-bottom: 30px; 
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* شريط المعلومات المدمج */
        .hero-info-glass {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            padding: 15px 25px;
            gap: 20px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 500px;
        }
        .info-stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #fff;
        }
        .info-stat i { color: var(--primary); font-size: 16px; }
        .info-divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.2);
        }

        /* أزرار التواصل الأنيقة */
        .hero-contact-row {
            display: flex;
            gap: 15px;
        }
        .h-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: 0.3s ease;
        }
        .h-btn:hover { background: var(--primary); border-color: var(--primary); transform: translateY(-3px);}

        /* =========================================
           شريط العروض المتحرك
           ========================================= */
        .offers-banner { 
            background: var(--primary); 
            color: #fff; 
            padding: 10px; 
            text-align: center; 
            font-size: 14px;
            font-weight: 600; 
            overflow: hidden; 
            white-space: nowrap; 
        }

        .offers-marquee { 
            display: inline-block; 
            animation: marquee 20s linear infinite; 
        }

        @keyframes marquee { 
            0% { transform: translateX(100%); } 
            100% { transform: translateX(-100%); } 
        }

        /* =========================================
           البحث والفلاتر
           ========================================= */
        .controls-section { 
            position: sticky; 
            top: 60px; 
            background: var(--bg-color); 
            z-index: 99; 
            padding: 15px 5%; 
            border-bottom: 1px solid var(--border); 
            box-shadow: var(--shadow-sm); 
        }

        .search-bar { 
            display: flex; 
            background: var(--surface); 
            border-radius: 12px; 
            padding: 12px 20px; 
            border: 1px solid var(--border); 
            margin-bottom: 15px; 
        }

        .search-bar input { 
            border: none; 
            background: transparent; 
            outline: none; 
            flex: 1; 
            color: var(--text-main); 
            font-size: 15px; 
            padding: 0 10px; 
        }

        .filters { 
            display: flex; 
            gap: 10px; 
            overflow-x: auto; 
            padding-bottom: 5px; 
            scrollbar-width: none; 
        }

        .filter-chip { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 13px; 
            font-weight: 600; 
            cursor: pointer; 
            color: var(--text-muted); 
            white-space: nowrap; 
        }

        .filter-chip.active, .filter-chip:hover { 
            background: var(--primary); 
            color: #fff; 
            border-color: var(--primary); 
        }

        /* =========================================
           أقسام المنيو (التبويبات العلوية)
           ========================================= */
        .categories-wrapper { 
            padding: 15px 5%; 
            background: var(--surface); 
            display: flex; 
            gap: 20px; 
            overflow-x: auto; 
            border-bottom: 1px solid var(--border); 
            scrollbar-width: none;
        }

        .cat-btn { 
            background: none; 
            border: none; 
            font-size: 15px; 
            font-weight: 700; 
            color: var(--text-muted); 
            cursor: pointer; 
            white-space: nowrap; 
            padding-bottom: 8px; 
            position: relative;
        }

        .cat-btn.active { color: var(--primary); }
        .cat-btn.active::after { 
            content: ''; 
            position: absolute; 
            bottom: -1px; 
            left: 0; 
            width: 100%; 
            height: 3px; 
            background: var(--primary); 
            border-radius: 3px 3px 0 0;
        }

        /* =========================================
           شبكة المنتجات (Menu Grid)
           ========================================= */
        .menu-container { 
            max-width: 1200px; 
            margin: 30px auto; 
            padding: 0 5%; 
        }

        .category-section { margin-bottom: 50px; scroll-margin-top: 180px; }
        
        .cat-title { 
            font-family: var(--font-head); 
            font-size: 24px; 
            margin-bottom: 20px; 
            color: var(--text-main); 
            border-bottom: 2px solid var(--primary); 
            display: inline-block;
            padding-bottom: 5px;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 20px; 
        }
        
        .card { 
            background: var(--surface); 
            border-radius: 16px; 
            border: 1px solid var(--border); 
            overflow: hidden; 
            box-shadow: var(--shadow-sm); 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            cursor: pointer;
        }

        .card:hover { 
            transform: translateY(-3px); 
            box-shadow: var(--shadow-md); 
            border-color: var(--primary); 
        }

        .card-img-wrap { position: relative; height: 180px; overflow: hidden; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card:hover .card-img { transform: scale(1.05); }

        .fav-btn { 
            position: absolute; 
            top: 12px; 
            right: 12px; 
            background: rgba(255,255,255,0.9); 
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: var(--text-muted); 
            font-size: 14px; 
            border: none; 
            cursor: pointer; 
            backdrop-filter: blur(5px); 
            z-index: 2;
        }

        .fav-btn.active { color: var(--danger); }

        .badges { 
            position: absolute; 
            top: 12px; 
            left: 12px; 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
            z-index: 2;
        }
        
        .badge { 
            background: var(--primary); 
            color: #fff; 
            font-size: 10px; 
            padding: 4px 8px; 
            border-radius: 8px; 
            font-weight: 700; 
            text-transform: uppercase; 
        }
        .badge.spicy { background: var(--danger); }
        .badge.veg { background: var(--success); }

        .card-body { padding: 15px; display: flex; flex-direction: column; flex: 1; }
        
        .card-meta { 
            display: flex; 
            justify-content: space-between; 
            font-size: 12px; 
            color: var(--text-muted); 
            margin-bottom: 8px; 
        }
        
        .rating { color: #FFD700; font-weight: 600; display: flex; align-items: center; gap: 4px;}
        
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; color: var(--text-main); line-height: 1.3;}
        
        .card-desc { 
            font-size: 13px; 
            color: var(--text-muted); 
            line-height: 1.4; 
            margin-bottom: 12px; 
            display: -webkit-box; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
            flex: 1;
        }
        
        .card-footer { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-top: 1px solid var(--border); 
            padding-top: 12px; 
        }
        
        .card-price { font-size: 17px; font-weight: 700; color: var(--primary); }
        
        .add-btn { 
            background: var(--bg-color); 
            border: 1px solid var(--primary); 
            color: var(--primary); 
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 14px; 
        }
        
        .card:hover .add-btn { background: var(--primary); color: #fff; }

        /* =========================================
           النافذة المنبثقة للمنتج (Modal)
           ========================================= */
        .modal { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.7); 
            z-index: 2000; 
            display: none; 
            justify-content: center; 
            align-items: flex-end; 
            backdrop-filter: blur(5px); 
        }
        
        .modal-content { 
            background: var(--surface); 
            width: 100%; 
            max-width: 600px; 
            height: 85vh; 
            border-radius: 20px 20px 0 0; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            animation: slideUp 0.3s ease; 
        }
        
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .close-modal { 
            position: absolute; 
            top: 12px; 
            right: 12px; 
            background: rgba(255,255,255,0.9); 
            color: var(--text-main); 
            border: none; 
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            font-size: 16px; 
            cursor: pointer; 
            z-index: 10;
        }
        
        .modal-scroll { overflow-y: auto; flex: 1; padding: 0 0 20px 0; }
        .modal-img { width: 100%; height: 220px; object-fit: cover; border-radius: 20px 20px 0 0;}
        .modal-info { padding: 20px; }
        
        .tabs { 
            display: flex; 
            border-bottom: 1px solid var(--border); 
            margin-bottom: 15px; 
        }
        
        .tab { 
            flex: 1; 
            text-align: center; 
            padding: 12px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 14px;
            color: var(--text-muted); 
        }
        
        .tab.active { 
            color: var(--primary); 
            border-bottom: 2px solid var(--primary); 
        }
        
        .custom-section { margin-bottom: 15px; }
        .custom-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; color: var(--text-main); display: flex; align-items: center; gap: 8px;}
        
        .option-row { 
            display: flex; 
            justify-content: space-between; 
            padding: 12px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            margin-bottom: 8px; 
            cursor: pointer; 
            font-size: 14px;
        }
        .option-row.active { border-color: var(--primary); background: rgba(229, 169, 55, 0.05); }

        #tab-reviews { display: none; padding: 0 20px; }
        
        .review-box { 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            padding: 12px; 
            margin-bottom: 10px; 
            background: var(--bg-color); 
        }
        
        .review-head { display: flex; justify-content: space-between; margin-bottom: 5px; }
        
        .review-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .review-form input, .review-form textarea { 
            padding: 10px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            background: var(--bg-co
